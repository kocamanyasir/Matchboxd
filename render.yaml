services:
  - type: web
    name: matchboxd
    runtime: docker
    plan: free
    region: frankfurt # Or oregon, ohio, singapore
    dockerfilePath: Dockerfile
    envVars:
      - key: NODE_ENV
        value: production
      - key: PUPPETEER_SKIP_CHROMIUM_DOWNLOAD
        value: "true"
      - key: PUPPETEER_EXECUTABLE_PATH
        value: /usr/bin/chromium
